  security:
    segment: security
    description: Материалы по информационной безопасности, уязвимостям, инцидентам и защите систем.
    routeable: false
    children:
      security-vulnerability-management:
        segment: vulnerabilities
        description: Материалы о конкретных уязвимостях, advisories, результатах обнаружения и техническом анализе риска.
        routeable: false
        children:
          security-advisories:
            segment: advisories
            description: Security advisories и уведомления поставщиков об уязвимостях и исправлениях.
          security-vulnerabilities:
            segment: analysis
            description: Технические описания и анализ конкретных уязвимостей, CVE, причин, exploitability и возможного воздействия.
          security-scanner-results:
            segment: scanner-results
            description: Результаты автоматических vulnerability scanners с найденными уязвимостями, версиями компонентов и уровнями серьёзности.
      security-assessment:
        segment: assessment
        description: "Рабочие материалы технической оценки защищённости: reconnaissance, scanning и penetration testing."
        routeable: false
        children:
          security-pentest:
            segment: pentest
            description: "Рабочие технические материалы penetration testing: scope, evidence, заметки проверки, отдельные findings и PoC."
            distinguishFrom:
              - Готовый формальный итоговый audit report относится к docs/reports/audits.
          security-recon:
            segment: recon
            description: "Материалы reconnaissance и attack-surface discovery: активы, сервисы, домены, endpoints и собранная техническая информация."
          security-scanning:
            segment: scanning
            description: Рабочие результаты портового, сервисного, web и другого технического сканирования в рамках оценки безопасности.
      security-defense:
        segment: defense
        description: Материалы защитных мер, безопасной конфигурации, правил обнаружения и контроля доступа.
        routeable: false
        children:
          security-hardening:
            segment: hardening
            description: Руководства и чек-листы по безопасной настройке и усилению защиты систем.
          security-detection-rules:
            segment: detection-rules
            description: Правила обнаружения для SIEM, IDS/IPS, EDR, YARA, Sigma и других defensive detection систем.
          security-access-control:
            segment: access-control
            description: Материалы политик и технических правил аутентификации, авторизации, RBAC/ACL и управления доступом.
      security-intelligence:
        segment: intelligence
        description: Threat intelligence, indicators of compromise и материалы анализа вредоносной активности.
        routeable: false
        children:
          security-threat-intel:
            segment: threat-intel
            description: "Threat intelligence: индикаторы компрометации, TTP и сведения об угрозах."
          security-iocs:
            segment: iocs
            description: "Наборы indicators of compromise: hashes, domains, IP addresses, URLs, signatures и связанные контекстные сведения."
          security-malware:
            segment: malware-analysis
            description: Технический анализ malware, образцов, поведения, persistence, capabilities и артефактов выполнения.
      security-incidents:
        segment: incidents
        description: Операционные материалы расследования и активного реагирования на инциденты безопасности.
        routeable: false
        children:
          security-incident-response:
            segment: incident-response
            description: "Операционные материалы активного реагирования на инциденты безопасности: runbooks, playbooks, рабочие действия и координация восстановления."
            distinguishFrom:
              - Завершённый postmortem и итоговый разбор причин относятся к docs/reports/incidents.
          security-forensics:
            segment: forensics
            description: "Digital forensics материалы: forensic images, timelines, артефакты систем и результаты технического расследования инцидента."
          security-evidence:
            segment: evidence
            description: Собранные evidence bundles и рабочие доказательные материалы конкретного security incident.
      security-design:
        segment: design
        description: "Проектирование безопасности: архитектура защиты, модели угроз, trust boundaries и security controls."
        routeable: false
        children:
          security-architecture:
            segment: architecture
            description: Архитектура безопасности, trust boundaries, модели угроз и проектные решения защиты.
          security-threat-models:
            segment: threat-models
            description: Threat models с активами, доверительными границами, adversary assumptions, угрозами и предлагаемыми mitigations.
