schemaVersion: 1
fallback: inbox
categories:
  inbox:
    segment: _INBOX
    description: Ресурсы, которые нельзя уверенно отнести к более конкретной категории.
  mine:
    segment: mine
    description: "Личные материалы пользователя: проекты, заметки, задачи, исследования, секреты, конфигурации, скрипты и изображения."
    routeable: false
    children:
      mine-projects:
        segment: projects
        description: Личные проекты пользователя и связанные с ними рабочие материалы.
        routeable: false
        children:
          mine-projects-active:
            segment: active
            description: Рабочие материалы личных проектов пользователя, которые сейчас активно разрабатываются или эксплуатируются и организуются прежде всего по статусу проекта.
          mine-projects-planned:
            segment: planned
            description: Рабочие материалы личных запланированных или предлагаемых проектов пользователя, работа над которыми ещё не началась.
          mine-projects-archived:
            segment: archived
            description: Рабочие материалы личных завершённых, замороженных или больше не используемых проектов пользователя.
      mine-ideas:
        segment: ideas
        description: Личные идеи, наброски, мозговые штурмы и результаты их оценки.
        routeable: false
        children:
          mine-ideas-brainstorming:
            segment: brainstorming
            description: Свободные наброски и результаты мозгового штурма без окончательной оценки.
          mine-ideas-evaluated:
            segment: evaluated
            description: Идеи, для которых уже проведена оценка реализуемости, пользы или приоритетов.
          mine-ideas-rejected:
            segment: rejected
            description: Отвергнутые или отложенные идеи с объяснением причин.
      mine-notes:
        segment: notes
        description: Личные заметки, дневники, размышления и рабочие черновики.
        routeable: false
        children:
          mine-notes-personal:
            segment: personal
            description: Обычные личные заметки, не относящиеся к более специальной категории.
          mine-notes-journal:
            segment: journal
            description: Дневниковые записи о событиях, делах и состоянии пользователя.
          mine-notes-reflections:
            segment: reflections
            description: Развёрнутые личные размышления, выводы и самоанализ.
          mine-notes-knowledge:
            segment: knowledge
            description: Личные конспекты и структурированные знания, собранные пользователем.
          mine-notes-drafts:
            segment: drafts
            description: Черновики текстов, сообщений, документов и других материалов пользователя.
      mine-reminders:
        segment: reminders
        description: Личные задачи, напоминания и ожидаемые действия.
        routeable: false
        children:
          mine-reminders-todo:
            segment: todo
            description: Конкретные задачи, которые пользователь планирует выполнить.
          mine-reminders-waiting-for:
            segment: waiting-for
            description: Задачи и вопросы, ожидающие действий или ответа от других людей или систем.
          mine-reminders-scheduled:
            segment: scheduled
            description: Задачи и напоминания, привязанные к конкретной дате или времени.
          mine-reminders-someday:
            segment: someday
            description: Необязательные задачи и идеи на будущее без конкретного срока.
      mine-research:
        segment: research
        description: "Рабочие материалы собственных исследований пользователя: эксперименты, сравнения, измерения, наблюдения и предварительные оценки до оформления отдельного отчёта."
        routeable: false
        children:
          mine-research-experiments:
            segment: experiments
            description: Экспериментальные проверки гипотез, конфигураций и вариантов реализации.
          mine-research-benchmarks:
            segment: benchmarks
            description: Рабочие результаты собственных сравнительных тестов пользователя с измерениями производительности; готовые самостоятельные отчёты относятся к ветке отчётов.
          mine-research-evaluations:
            segment: evaluations
            description: Рабочие оценки пользователем инструментов, моделей, сервисов или подходов с выводами, ещё не оформленные как самостоятельный формальный отчёт.
          mine-research-observations:
            segment: observations
            description: Наблюдения и собранные факты, ещё не оформленные в полный анализ.
      mine-passwords:
        segment: secrets
        description: "Личные секреты и материалы доступа пользователя: учётные данные, токены, криптографические ключи и сертификаты."
        routeable: false
        children:
          mine-passwords-accounts:
            segment: accounts
            description: "Учётные данные аккаунтов: логины, пароли и связанные сведения."
          mine-passwords-api-tokens:
            segment: api-tokens
            description: API-ключи, access tokens, refresh tokens и другие программные токены доступа.
          mine-passwords-ssh:
            segment: ssh
            description: SSH-ключи, known_hosts и связанные данные доступа по SSH.
          mine-passwords-crypto-keys:
            segment: crypto-keys
            description: GPG, age, minisign и другие криптографические ключи.
          mine-passwords-certificates:
            segment: certificates
            description: Клиентские сертификаты, приватные ключи сертификатов и цепочки доверия.
      mine-bookmarks:
        segment: bookmarks
        description: Сохранённые ссылки, списки чтения и коллекции полезных ресурсов.
        routeable: false
        children:
          mine-bookmarks-reading-list:
            segment: reading-list
            description: Материалы и ссылки, которые пользователь собирается прочитать позже.
          mine-bookmarks-favorites:
            segment: favorites
            description: Часто используемые или особо ценные сохранённые ссылки.
          mine-bookmarks-tools:
            segment: tools
            description: Ссылки на онлайн-инструменты, сервисы и утилиты.
          mine-bookmarks-reference:
            segment: reference
            description: Ссылки на справочные страницы и ресурсы, к которым нужно возвращаться.
      mine-configs:
        segment: configs
        description: Личные и эксплуатационные конфигурации пользовательской среды и собственных сервисов вне исходного дерева конкретного программного проекта.
        routeable: false
        children:
          mine-configs-dotfiles:
            segment: dotfiles
            description: Пользовательские dotfiles и настройки интерактивной среды.
            routeable: false
            children:
              mine-configs-dotfiles-nvim:
                segment: nvim
                description: Конфигурация Neovim и его плагинов.
              mine-configs-dotfiles-vscode:
                segment: vscode
                description: Пользовательские настройки Visual Studio Code, профили и расширения.
              mine-configs-dotfiles-tmux:
                segment: tmux
                description: "Пользовательская конфигурация tmux: параметры сессий, окон, клавиш и поведения терминального мультиплексора."
              mine-configs-dotfiles-zsh:
                segment: zsh
                description: Пользовательская конфигурация Zsh.
              mine-configs-dotfiles-bash:
                segment: bash
                description: Пользовательская конфигурация Bash.
              mine-configs-dotfiles-fish:
                segment: fish
                description: Пользовательская конфигурация Fish shell.
              mine-configs-dotfiles-git:
                segment: git
                description: Пользовательская конфигурация Git, алиасы и настройки поведения.
              mine-configs-dotfiles-ssh:
                segment: ssh
                description: "Пользовательская конфигурация SSH: hosts, aliases, connection options и параметры клиента."
                distinguishFrom:
                  - Приватные SSH-ключи и чувствительные материалы доступа относятся к mine/secrets/ssh.
          mine-configs-docker:
            segment: docker
            description: Эксплуатационные конфигурации Docker и Docker Compose для собственных развёрнутых или self-hosted сервисов пользователя, а не build-файлы проекта.
          mine-configs-kubernetes:
            segment: kubernetes
            description: Личные Kubernetes manifests, контексты и эксплуатационные настройки собственных кластеров.
            distinguishFrom:
              - Секретные токены и credentials не относятся к конфигурационной ветке и должны храниться среди личных секретов.
              - Kubernetes manifests, являющиеся частью программного репозитория или infrastructure-as-code проекта, относятся к code/infrastructure/kubernetes.
          mine-configs-systemd:
            segment: systemd
            description: Личные systemd service, timer и связанные unit-файлы.
          mine-configs-nginx:
            segment: nginx
            description: Личные конфигурации Nginx и reverse proxy.
          mine-configs-databases:
            segment: databases
            description: Личные настройки PostgreSQL, MySQL, Redis, Neo4j и других баз данных.
          mine-configs-applications:
            segment: applications
            description: Конфигурации пользовательских приложений, не подходящие к более специальной категории.
      mine-scripts:
        segment: scripts
        description: Самостоятельные личные или административные скрипты пользователя для установки, настройки и автоматизации вне исходного дерева конкретного программного проекта.
        routeable: false
        children:
          mine-scripts-install:
            segment: install
            description: Скрипты установки программ и компонентов.
          mine-scripts-setup:
            segment: setup
            description: Скрипты первичной настройки среды и систем.
          mine-scripts-automation:
            segment: automation
            description: Регулярная автоматизация, cron-задачи и повторяемые служебные процедуры.
          mine-scripts-maintenance:
            segment: maintenance
            description: Скрипты обслуживания, очистки, резервного копирования и диагностики.
          mine-scripts-migration:
            segment: migration
            description: Одноразовые или повторяемые скрипты миграции данных и конфигураций.
          mine-scripts-one-off:
            segment: one-off
            description: Разовые утилиты и временные служебные скрипты.
      mine-photos:
        segment: photos
        description: Личные фотографии, изображения документов и скриншоты.
        routeable: false
        children:
          mine-photos-people:
            segment: people
            description: Личные фотографии людей, портреты и снимки, где основным содержимым являются люди.
          mine-photos-nature:
            segment: nature
            description: Фотографии природы, пейзажей и мест.
          mine-photos-screenshots:
            segment: screenshots
            description: Скриншоты приложений, браузера, терминала и интерфейсов.
          mine-photos-documents:
            segment: documents
            description: Фотографии или снимки бумажных документов и записей.
          mine-photos-misc:
            segment: misc
            description: Прочие личные изображения и фотографии.
      mine-records:
        segment: records
        description: Личные записи и документы пользователя о личности, финансах, здоровье, поездках, работе, образовании и покупках.
        routeable: false
        children:
          mine-records-identity:
            segment: identity
            description: Официальные и идентификационные документы, а также персональные контактные сведения пользователя.
            routeable: false
            children:
              mine-records-identity-documents:
                segment: documents
                description: Паспорта, удостоверения, свидетельства и другие официальные документы, подтверждающие личность или гражданское состояние.
              mine-records-contacts:
                segment: contacts
                description: Личные адресные книги, vCard-файлы и структурированные контактные сведения.
          mine-records-finance:
            segment: finance
            description: Личные финансовые документы, платежи, банковские записи и налоговые материалы пользователя.
            routeable: false
            children:
              mine-records-receipts:
                segment: receipts
                description: Кассовые и электронные чеки, подтверждающие личные покупки и платежи.
              mine-records-invoices:
                segment: invoices
                description: Счета на оплату и инвойсы, выставленные пользователю или сохранённые для личного учёта.
              mine-records-banking:
                segment: banking
                description: Банковские выписки, отчёты по счетам и другие личные банковские документы.
              mine-records-taxes:
                segment: taxes
                description: Налоговые декларации, расчёты, уведомления и подтверждающие документы пользователя.
              mine-records-subscriptions:
                segment: subscriptions
                description: Записи о личных подписках, тарифах, регулярных платежах и сроках продления.
          mine-records-health:
            segment: health
            description: Личные медицинские документы и сведения о здоровье пользователя.
            routeable: false
            children:
              mine-records-medical:
                segment: medical-records
                description: Медицинские заключения, выписки, истории обращений и другие клинические документы пользователя.
              mine-records-labs:
                segment: lab-results
                description: Результаты лабораторных анализов, исследований и диагностических измерений пользователя.
              mine-records-prescriptions:
                segment: prescriptions
                description: Рецепты, назначения лекарств и схемы лечения пользователя.
          mine-records-travel:
            segment: travel
            description: Личные документы поездок, маршруты, бронирования и транспортные билеты.
            routeable: false
            children:
              mine-records-itineraries:
                segment: itineraries
                description: Маршруты и планы личных поездок с последовательностью мест, дат и действий.
              mine-records-bookings:
                segment: bookings
                description: Подтверждения бронирований жилья, транспорта, мероприятий и других услуг для поездок.
              mine-records-tickets:
                segment: tickets
                description: Билеты и посадочные документы на самолёты, поезда, автобусы, мероприятия и другие поездки.
          mine-records-career:
            segment: career
            description: Личные документы карьеры, поиска работы и трудовых отношений.
            routeable: false
            children:
              mine-records-resumes:
                segment: resumes
                description: Резюме, CV и профессиональные профили пользователя.
              mine-records-employment:
                segment: employment
                description: Трудовые предложения, кадровые документы и записи о занятости пользователя.
          mine-records-education:
            segment: education
            description: Личные документы об обучении, квалификации и академических результатах.
            routeable: false
            children:
              mine-records-certificates:
                segment: certificates
                description: Дипломы, сертификаты о прохождении обучения и документы о квалификации пользователя.
              mine-records-transcripts:
                segment: transcripts
                description: Академические ведомости, приложения к диплому и другие записи об образовательных результатах.
          mine-records-purchases:
            segment: purchases
            description: Документы о личных покупках, заказах и гарантийных обязательствах.
            routeable: false
            children:
              mine-records-orders:
                segment: orders
                description: Подтверждения заказов и карточки приобретённых товаров или услуг.
              mine-records-warranties:
                segment: warranties
                description: Гарантийные талоны, условия гарантии и подтверждения сервисного обслуживания личных покупок.
  docs:
    segment: docs
    description: Документация, руководства, справочные материалы, книги, курсы, исследования и отчёты.
    routeable: false
    children:
      docs-guides:
        segment: guides
        description: Практические руководства и пошаговые инструкции.
        routeable: false
        children:
          docs-guides-tutorials:
            segment: tutorials
            description: Учебные пошаговые руководства, которые последовательно обучают теме с нуля.
          docs-guides-howtos:
            segment: howtos
            description: Краткие практические инструкции по выполнению одной конкретной задачи.
          docs-guides-walkthroughs:
            segment: walkthroughs
            description: Подробные проходы по процессу, интерфейсу или сценарию использования.
          docs-guides-best-practices:
            segment: best-practices
            description: Рекомендованные практики, устойчивые подходы и проверенные шаблоны работы.
          docs-guides-troubleshooting:
            segment: troubleshooting
            description: Диагностика неисправностей, симптомы, причины и способы устранения проблем.
      docs-manuals:
        segment: manuals
        description: Полные руководства по использованию, администрированию и эксплуатации систем.
        routeable: false
        children:
          docs-manuals-user:
            segment: user
            description: Руководства для конечных пользователей.
          docs-manuals-admin:
            segment: admin
            description: Руководства системного или прикладного администратора.
          docs-manuals-operator:
            segment: operator
            description: Эксплуатационные руководства для операторов, SRE и дежурных инженеров.
          docs-manuals-developer:
            segment: developer
            description: Руководства разработчика по расширению, сборке или интеграции системы.
          docs-manuals-installation:
            segment: installation
            description: Полные руководства по установке, развёртыванию и первоначальной настройке.
      docs-reference:
        segment: reference
        description: Краткие справочные материалы для быстрого поиска конкретной информации.
        routeable: false
        children:
          docs-reference-cheatsheets:
            segment: cheatsheets
            description: Короткие шпаргалки и компактные памятки для быстрого поиска команд, синтаксиса, сочетаний клавиш и практических приёмов.
          docs-reference-commands:
            segment: commands
            description: Справочники команд CLI, shell и интерактивных инструментов.
          docs-reference-patterns:
            segment: patterns
            description: Каталоги архитектурных, программных и эксплуатационных шаблонов.
          docs-reference-gotchas:
            segment: gotchas
            description: Известные подводные камни, ограничения и неожиданные особенности.
          docs-reference-glossary:
            segment: glossary
            description: Глоссарии терминов, сокращений и понятий.
      docs-specifications:
        segment: specifications
        description: Формальные спецификации, стандарты и определения форматов.
        routeable: false
        children:
          docs-specifications-protocols:
            segment: protocols
            description: Формальные спецификации сетевых, прикладных и межсистемных протоколов.
          docs-specifications-schemas:
            segment: schemas
            description: Формальные схемы данных, конфигураций, сообщений и API.
          docs-specifications-standards:
            segment: standards
            description: Отраслевые и технические стандарты.
          docs-specifications-rfcs:
            segment: rfcs
            description: RFC, proposal-документы и формальные предложения изменений.
          docs-specifications-formats:
            segment: formats
            description: Спецификации файловых форматов, сериализации и контейнеров данных.
      docs-api:
        segment: api
        description: Документация программных интерфейсов и способов интеграции.
        routeable: false
        children:
          docs-api-rest:
            segment: rest
            description: "Документация REST/HTTP API: endpoints, параметры, тела запросов и ответы."
          docs-api-graphql:
            segment: graphql
            description: GraphQL schema, queries, mutations и правила использования.
          docs-api-sdk:
            segment: sdk
            description: Документация SDK и клиентских библиотек.
          docs-api-cli:
            segment: cli
            description: Справочник программного CLI как интерфейса автоматизации.
          docs-api-webhooks:
            segment: webhooks
            description: Документация webhooks, callbacks и событийных интеграций.
      docs-languages:
        segment: languages
        description: Учебные и справочные материалы по языкам программирования.
        routeable: false
        children:
          docs-languages-javascript:
            segment: javascript
            description: "Учебные и справочные материалы по JavaScript и TypeScript: язык, платформы, библиотеки, idioms и практические примеры."
            distinguishFrom:
              - Исходный код программного проекта на этом языке относится к соответствующей категории code/source.
          docs-languages-python:
            segment: python
            description: "Учебные и справочные материалы по Python: язык, стандартная библиотека, idioms и практические примеры."
            distinguishFrom:
              - Исходный код программного проекта на этом языке относится к соответствующей категории code/source.
          docs-languages-go:
            segment: go
            description: "Учебные и справочные материалы по Go: язык, стандартная библиотека, idioms и практические примеры."
            distinguishFrom:
              - Исходный код программного проекта на этом языке относится к соответствующей категории code/source.
          docs-languages-rust:
            segment: rust
            description: "Учебные и справочные материалы по Rust: язык, стандартная библиотека, idioms и практические примеры."
            distinguishFrom:
