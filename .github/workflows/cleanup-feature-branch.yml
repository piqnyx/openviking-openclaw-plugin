name: Cleanup feature branch artifacts

on:
  push:
    branches:
      - agent/async-mutation-lifecycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/async-mutation-lifecycle
          fetch-depth: 0

      - name: Add repository ignore policy
        run: |
          cat > .gitignore <<'EOF'
          node_modules/
          coverage/
          *.tsbuildinfo
          *.log
          .DS_Store
          .env
          .env.*
          !.env.example
          EOF

      - name: Remove accidentally tracked dependencies
        run: git rm -r --cached --ignore-unmatch node_modules

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/cleanup-feature-branch.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: ignore local dependency artifacts"
          git push origin HEAD:agent/async-mutation-lifecycle
