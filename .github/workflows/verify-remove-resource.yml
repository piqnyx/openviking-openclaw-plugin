name: Publish verified remove_resource patch

on:
  push:
    paths:
      - .github/workflows/verify-remove-resource.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/remove-resource

      - name: Require the already-tested feature head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8d0ac656d7c2a7891043582bab7d429c6bbaea05'

      - name: Apply the implementation patch verified by PR CI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/piqnyx/openviking-openclaw-plugin/d4c65230c87313f44e4f741f28b984c1cf391dd0/changes/remove-resource.patch' \
            -o /tmp/remove-resource.patch
          git apply --check /tmp/remove-resource.patch
          git apply /tmp/remove-resource.patch
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'piqnyx CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add guarded remove_resource tool'
          git push origin HEAD:feature/remove-resource
