name: Resource routing v1 validation

on:
  push:
    branches:
      - agent/resource-routing-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic resource-routing integration
        run: node .github/scripts/integrate-resource-routing-v1.mjs

      - name: Refresh lockfile for declared dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and tests
        run: npm run verify

      - name: Diff check
        run: git diff --check

      - name: Commit verified integration changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'resource-routing-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            config.ts \
            openclaw.plugin.json \
            install-manifest.json \
            resource-routing/default-taxonomy.yaml \
            package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Integrate resource routing config foundation [skip ci]'
          git push origin HEAD:agent/resource-routing-v1
