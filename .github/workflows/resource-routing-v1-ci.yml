name: Resource routing v1 validation

on:
  push:
    branches:
      - agent/resource-routing-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile for declared dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Commit lockfile if npm changed it
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name 'resource-routing-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh lockfile for YAML taxonomy support'
          git push origin HEAD:agent/resource-routing-v1
