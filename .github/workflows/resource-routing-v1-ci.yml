name: Resource routing v1 validation

on:
  push:
    branches:
      - agent/resource-routing-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic config integration if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'parseResourceRoutingConfig' config.ts; then
            node .github/scripts/integrate-resource-routing-v1.mjs
          fi

      - name: Apply deterministic add_resource routing integration if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'resourceRoutingManager' plugin/openviking-import-tools.ts; then
            node .github/scripts/integrate-resource-routing-add-resource-v2.mjs
          fi

      - name: Normalize narrow TypeScript test fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/resource-routing-add-resource-plan.test.ts')
          s = p.read_text()
          s = s.replace('fallbackReason: "below-min-score",', 'fallbackReason: "below-min-score" as const,', 1)
          if 'timingMs:' not in s:
              s = s.replace('rerankerUsed: false,', 'rerankerUsed: false,\n        timingMs: { embedding: 1, total: 1 },')
          p.write_text(s)

          p = Path('tests/resource-routing-add-resource-tool.test.ts')
          s = p.read_text()
          if 'timingMs:' not in s:
              s = s.replace('rerankerUsed: false,', 'rerankerUsed: false,\n        timingMs: { embedding: 1, total: 1 },')
          p.write_text(s)
          PY

      - name: Refresh lockfile for declared dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and tests
        run: npm run verify

      - name: Diff check
        run: git diff --check

      - name: Commit verified integration changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'resource-routing-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            client.ts \
            config.ts \
            index.ts \
            plugin/openviking-import-tools.ts \
            openclaw.plugin.json \
            install-manifest.json \
            resource-routing/default-taxonomy.yaml \
            tests/resource-routing-add-resource-plan.test.ts \
            tests/resource-routing-add-resource-tool.test.ts \
            package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Integrate automatic add_resource routing [skip ci]'
          git push origin HEAD:agent/resource-routing-v1
