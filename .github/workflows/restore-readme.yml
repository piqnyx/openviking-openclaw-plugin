name: Restore README and clarify release summary

on:
  push:
    branches:
      - agent/async-mutation-lifecycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/async-mutation-lifecycle
          fetch-depth: 0

      - name: Restore exact verified README and edit one sentence
        run: |
          git checkout a57b91efd5f7311ed1b9fa45c93e51385b4a76ac -- README.md
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          old = "The fork keeps the upstream context-engine behavior while routing each OpenClaw agent to a separate OpenViking account/API key. Release **2026.7.15-isolation.8** adds configurable per-agent resource routing on top of the guarded `remove_resource` support introduced in `isolation.6`."
          new = "The fork keeps the upstream context-engine behavior while routing each OpenClaw agent to a separate OpenViking account/API key. Release **2026.7.15-isolation.8** keeps the configurable per-agent resource routing introduced in `isolation.7` and hardens the agent-facing mutation lifecycle on top of the guarded `remove_resource` support introduced in `isolation.6`."
          if s.count(old) != 1:
              raise SystemExit("README release-summary target not found exactly once")
          p.write_text(s.replace(old, new))
          PY

      - name: Remove one-shot workflow and verify diff
        run: |
          rm -f .github/workflows/restore-readme.yml
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: restore complete release documentation"
          git push origin HEAD:agent/async-mutation-lifecycle
