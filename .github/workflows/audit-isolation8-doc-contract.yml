name: Audit isolation8 documentation contract

on:
  push:
    branches:
      - agent/isolation8-skill-doc-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Find mutation lifecycle references
        shell: bash
        run: |
          echo '=== remove_resource references ==='
          git grep -n -I 'remove_resource' -- '*.md' '*.json' '*.ts' ':!dist/**' || true
          echo '=== wait/timeout documentation candidates ==='
          git grep -n -I -E 'Wait for processing completion|wait=true|wait.*semantic|timeout.*wait|defaults? .*wait|Set wait=true' -- '*.md' '*.json' '*.ts' ':!dist/**' || true
          echo '=== agent import sections ==='
          git grep -n -I -E 'add_resource|add_skill' -- 'README*.md' 'INSTALL*.md' 'docs/*.md' 'skills/**/*.md' || true
