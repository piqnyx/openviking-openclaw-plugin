name: Routing migration CI

on:
  push:
    branches:
      - agent/russian-routing-taxonomy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply routing semantic-text separation
        run: python3 tools/apply-routing-text-separation.py

      - name: Repair migrated routing fixtures
        run: python3 tools/repair-routing-text-separation-fixtures.py

      - name: Validate generated patch
        run: git diff --check

      - name: Typecheck migrated tree
        run: npm run typecheck

      - name: Build migrated tree
        run: npm run build

      - name: Run routing regression suite
        run: >-
          npx vitest run
          tests/resource-taxonomy.test.ts
          tests/resource-routing-retrieval.test.ts
          tests/resource-router.test.ts
          tests/resource-routing-semantic-audit.test.ts
          tests/add-resource-routing-tool.test.ts
          tests/resource-routing-preload.test.ts
          tests/resource-routing-service.test.ts
          tests/routing-probe.test.mjs
