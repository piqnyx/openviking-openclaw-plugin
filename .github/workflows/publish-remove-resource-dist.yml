name: Publish verified remove_resource dist

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-remove-resource-dist.yml

permissions:
  contents: write

jobs:
  publish-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/remove-resource

      - name: Require the verified feature head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '468a6b54f98eb5a4c25e5b6740fc093c199bc1f1'

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run verify

      - name: Typecheck including tests
        run: npm run typecheck

      - name: Commit generated dist only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'piqnyx CI'
          git config user.email 'actions@users.noreply.github.com'
          git add dist
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'build: refresh dist for remove_resource'
          git push origin HEAD:feature/remove-resource
