name: Apply audited remove_resource hardening

# One-shot trigger after the workflow is present on main.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-remove-resource-dist.yml

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/remove-resource

      - name: Require audited feature head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd7832fa9373dbb829df71f9f6288af54aeee6566'

      - name: Fetch and apply hardening patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/piqnyx/openviking-openclaw-plugin/d7832fa9373dbb829df71f9f6288af54aeee6566/changes/remove-resource-hardening.patch' \
            -o /tmp/remove-resource-hardening.patch
          git apply --check /tmp/remove-resource-hardening.patch
          git apply /tmp/remove-resource-hardening.patch
          rm -f changes/remove-resource-hardening.patch
          rmdir changes 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run verify

      - name: Typecheck including tests
        run: npm run typecheck

      - name: Commit audited source, tests, and generated dist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'piqnyx CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce resource-only deletion at client boundary'
          git push origin HEAD:feature/remove-resource
