name: Finalize remove_resource package version

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-remove-resource-dist.yml

permissions:
  contents: write

jobs:
  finalize-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/remove-resource

      - name: Require the verified feature head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f2b9e88e53727298eca06464a244c5d9cefd0559'

      - name: Set package version without creating a tag
        run: npm version 2026.7.15-isolation.6 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run verify

      - name: Typecheck including tests
        run: npm run typecheck

      - name: Commit package metadata only
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = '2026.7.15-isolation.6'
          test "$(node -p 'require("./package-lock.json").version')" = '2026.7.15-isolation.6'
          test "$(node -p 'require("./package-lock.json").packages[""] .version')" = '2026.7.15-isolation.6'
          git diff --exit-code -- dist
          git config user.name 'piqnyx CI'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m 'chore: bump plugin version to isolation.6'
          git push origin HEAD:feature/remove-resource
