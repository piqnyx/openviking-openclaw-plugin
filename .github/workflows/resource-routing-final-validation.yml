# Triggered after workflow creation so push validation runs with the workflow already present.
name: Resource routing final validation

on:
  push:
    branches:
      - agent/resource-routing-v1

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('resource-routing/config.ts')
          s = p.read_text()
          old = 'const DEFAULT_EMBEDDING_TIMEOUT_MS = 3_000;'
          new = 'const DEFAULT_EMBEDDING_TIMEOUT_MS = 30_000;'
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('embedding timeout correction anchor missing')
          p.write_text(s)

          p = Path('tests/resource-routing-add-resource-plan.test.ts')
          s = p.read_text()
          import_anchor = 'import {\n  AddResourceRoutingError,\n  planAddResourceRouting,'
          if 'ResourceRoutingCategoryError' not in s:
              s = s.replace(
                  import_anchor,
                  'import { ResourceRoutingCategoryError } from "../resource-routing/manager.js";\n\n' + import_anchor,
                  1,
              )
          s = s.replace(
              'throw new Error("unknown category");',
              'throw new ResourceRoutingCategoryError("unknown category");',
              1,
          )
          if 'ResourceRoutingCategoryError("unknown category")' not in s:
              raise SystemExit('typed invalid-category fixture correction anchor missing')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and tests
        run: npm run verify

      - name: Diff check
        run: git diff --check

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/openviking-pack.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/openviking-pack.json', 'utf8'));
          const files = new Set(data[0].files.map((entry) => entry.path));
          for (const required of [
            'resource-routing/default-taxonomy.yaml',
            'dist/resource-routing/manager.js',
            'dist/resource-routing/decision.js',
            'dist/resource-routing/ml-client.js',
          ]) {
            if (!files.has(required)) throw new Error(`package is missing ${required}`);
          }
          NODE

      - name: Commit verified final corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'resource-routing-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add resource-routing/config.ts tests/resource-routing-add-resource-plan.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize resource routing defaults and error classification [skip ci]'
          git push origin HEAD:agent/resource-routing-v1
