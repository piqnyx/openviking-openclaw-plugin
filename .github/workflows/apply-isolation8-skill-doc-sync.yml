name: Apply isolation8 skill documentation sync

on:
  push:
    branches:
      - agent/isolation8-skill-doc-sync
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-isolation8-skill-doc-sync
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/isolation8-skill-doc-sync
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Synchronize embedded agent skill
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("skills/openviking-context-database/SKILL.md")
          s = p.read_text()

          def repl(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one target, found {count}")
              s = s.replace(old, new)

          repl(
              "- When automatic resource routing is enabled, inspect or read enough of the resource to understand its actual content before calling `add_resource`, unless that content is already established in the conversation. Supply a short semantic `summary`; never infer it from filename/path alone.",
              "- When automatic resource routing is enabled, inspect or read enough of the resource to understand its actual content before calling `add_resource`, unless that content is already established in the conversation. Supply a short semantic `summary` describing content and purpose. When provenance is part of the semantic resource type, state it naturally, for example online article, email thread, meeting transcript, or terminal screenshot. Never infer the summary from filename/path alone or copy raw filename/path/MIME/storage metadata into it.",
              "summary safety bullet",
          )

          repl(
              "- Use `add_skill` only when the user explicitly asks to import, add, install, or register an Agent Skill into OpenViking.\n",
              "- Use `add_skill` only when the user explicitly asks to import, add, install, or register an Agent Skill into OpenViking.\n- Use `remove_resource` only when `enableRemoveResourceTool=true` and the user explicitly asks to delete imported OpenViking resource content. It may remove only descendants of `viking://resources/`; never use it for memories, sessions, skills, or the resources root.\n",
              "remove safety bullet",
          )

          repl(
              "| Import/register an Agent Skill | `add_skill` |\n",
              "| Import/register an Agent Skill | `add_skill` |\n| Delete imported resource content | `remove_resource` only if `enableRemoveResourceTool=true` |\n",
              "tool selection row",
          )

          repl(
              "| `scoreThreshold` | No | Search threshold, default `recallScoreThreshold`. |",
              "| `scoreThreshold` | No | Search threshold `0..1`. Defaults to `recallScoreThreshold`. |",
              "memory forget score threshold",
          )

          repl(
              "For automatic routing, first inspect/read enough of the resource to understand its actual content unless the content is already known from the conversation. Then provide `summary` as one short sentence describing semantic content and purpose. Do not use filename/path/MIME/storage location as a substitute for content. The plugin performs deterministic category selection and builds the trusted `viking://resources/...` parent URI; do not invent a URI or category key.",
              "For automatic routing, first inspect/read enough of the resource to understand its actual content unless the content is already known from the conversation. Then provide `summary` as one short sentence describing semantic content and purpose. When provenance is part of the semantic resource type, state it naturally, for example online article, email thread, meeting transcript, or terminal screenshot. Do not use filename/path/MIME/storage location as a substitute for content or copy those raw values into the summary. The plugin performs deterministic category selection and builds the trusted `viking://resources/...` parent URI; do not invent a URI or category key.",
              "add_resource summary guidance",
          )

          repl(
              "| `summary` | Automatic routing only | One short sentence based on known/inspected content describing what the resource is about and what it is useful for. |",
              "| `summary` | Automatic routing only | One short sentence based on known/inspected content describing what the resource is about and what it is useful for; include semantically relevant provenance such as online article/email/transcript/screenshot when it defines the resource type. |",
              "summary parameter guidance",
          )

          repl(
              "| `instruction` | No | Processing instruction for OpenViking semantic extraction. |\n| `wait` | No | Wait for processing completion. |\n| `timeout` | No | Timeout in seconds when `wait=true`. |\n",
              "| `instruction` | No | Processing instruction for OpenViking semantic extraction. |\n",
              "remove add_resource wait parameters",
          )

          repl(
              "The current OpenClaw tool exposes the parameters above. The underlying client also supports server-facing resource options such as `strict`, `ignore_dirs`, `include`, `exclude`, and `preserve_structure` for command/internal paths; do not pass them to the tool unless the registered schema exposes them.\n\n### `add_skill`",
              "The current OpenClaw tool exposes the parameters above and always submits the import with `wait=false`. OpenViking continues parsing, VLM, embedding, and indexing work asynchronously after accepting the job. If a mutating request loses its HTTP response, the tool reports an outcome-unknown state; inspect OpenViking before retrying and never repeat the same import automatically. The underlying client also supports explicit `wait`/`timeout` and server-facing resource options such as `strict`, `ignore_dirs`, `include`, `exclude`, and `preserve_structure` for manual/command/internal paths; do not pass them to the agent tool unless its registered schema exposes them.\n\n### `add_skill`",
              "add_resource async contract",
          )

          repl(
              "| `source` | No | Local `SKILL.md` path or skill directory. Exactly one of `source` or `data` is required. |\n| `data` | No | Raw `SKILL.md` content or an MCP tool dict. Exactly one of `source` or `data` is required. |\n| `wait` | No | Wait for processing completion. |\n| `timeout` | No | Timeout in seconds when `wait=true`. |\n\nAgent Skill best practice:",
              "| `source` | No | Local `SKILL.md` path or skill directory. Exactly one of `source` or `data` is required. |\n| `data` | No | Raw `SKILL.md` content or an MCP tool dict. Exactly one of `source` or `data` is required. |\n\nThe agent-facing tool always submits skill imports with `wait=false`. OpenViking processing continues asynchronously. On an outcome-unknown transport failure, inspect OpenViking skills before any deliberate retry; do not automatically submit the same mutation again. Manual slash-command and low-level client paths keep explicit `wait`/`timeout` controls.\n\nAgent Skill best practice:",
              "add_skill async contract",
          )

          repl(
              "Agent Skill best practice: a skill should have precise frontmatter (`name`, trigger-oriented `description`, useful `tags`), clear scope boundaries, explicit “when not to use” guidance if needed, and executable steps with concrete parameters. Keep secrets out of skill content.\n\n### `ov_search`",
              "Agent Skill best practice: a skill should have precise frontmatter (`name`, trigger-oriented `description`, useful `tags`), clear scope boundaries, explicit “when not to use” guidance if needed, and executable steps with concrete parameters. Keep secrets out of skill content.\n\n### `remove_resource`\n\nDelete imported OpenViking resource content below `viking://resources/`. This destructive agent tool is disabled unless `enableRemoveResourceTool=true`. Use it only for an explicit user deletion request.\n\n| Parameter | Required | Description |\n|---|---|---|\n| `uri` | Yes | Exact descendant of `viking://resources/`. The resources root and non-resource namespaces are refused. |\n| `recursive` | No | Remove an entire non-empty resource subtree; defaults to `false`. |\n\nThe agent tool always calls OpenViking with `wait=false`. The filesystem deletion completes before OpenViking returns, while semantic/index refresh may continue with `semantic_status=queued`. `NOT_FOUND` is reported as already absent. If the transport fails without an HTTP response, the mutation outcome is unknown; inspect the URI before any deliberate retry and never repeat the delete automatically.\n\n### `ov_search`",
              "remove_resource reference section",
          )

          p.write_text(s)
          PY

      - name: Add embedded skill contract regression
        run: |
          cat > tests/agent-skill-contract.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const skill = readFileSync("skills/openviking-context-database/SKILL.md", "utf8");

          function section(name: string, nextName: string): string {
            const start = skill.indexOf(`### \`${name}\``);
            const end = skill.indexOf(`### \`${nextName}\``, start + 1);
            expect(start).toBeGreaterThanOrEqual(0);
            expect(end).toBeGreaterThan(start);
            return skill.slice(start, end);
          }

          describe("embedded OpenViking agent skill mutation contract", () => {
            it("documents add_resource as asynchronous without agent wait/timeout parameters", () => {
              const text = section("add_resource", "add_skill");
              expect(text).not.toContain("| `wait` |");
              expect(text).not.toContain("| `timeout` |");
              expect(text).toContain("wait=false");
              expect(text).toContain("outcome-unknown");
              expect(text).toContain("never repeat the same import automatically");
            });

            it("documents add_skill as asynchronous without agent wait/timeout parameters", () => {
              const text = section("add_skill", "remove_resource");
              expect(text).not.toContain("| `wait` |");
              expect(text).not.toContain("| `timeout` |");
              expect(text).toContain("wait=false");
              expect(text).toContain("Manual slash-command and low-level client paths keep explicit `wait`/`timeout`");
            });

            it("documents guarded asynchronous remove_resource behavior", () => {
              const text = section("remove_resource", "ov_search");
              expect(text).toContain("enableRemoveResourceTool=true");
              expect(text).toContain("| `uri` | Yes |");
              expect(text).toContain("| `recursive` | No |");
              expect(text).not.toContain("| `wait` |");
              expect(text).not.toContain("| `timeout` |");
              expect(text).toContain("semantic_status=queued");
              expect(text).toContain("NOT_FOUND");
              expect(text).toContain("never repeat the delete automatically");
            });

            it("keeps synchronous wait controls documented for manual slash commands", () => {
              expect(skill).toContain("/add-resource ./README.md --to viking://resources/openviking-readme --wait");
              expect(skill).toContain("/add-skill ./skills/openviking-context-database --wait --timeout=30");
            });
          });
          EOF

      - name: Verify no stale agent mutation parameters remain in embedded skill
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("skills/openviking-context-database/SKILL.md").read_text()
          for name, next_name in (("add_resource", "add_skill"), ("add_skill", "remove_resource"), ("remove_resource", "ov_search")):
              start = s.index(f"### `{name}`")
              end = s.index(f"### `{next_name}`", start + 1)
              section = s[start:end]
              if "| `wait` |" in section or "| `timeout` |" in section:
                  raise SystemExit(f"stale wait/timeout parameter remains in {name}")
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm run verify

      - name: Check generated runtime and whitespace
        run: |
          git diff --exit-code -- dist
          git diff --check

      - name: Remove audit scaffolding
        run: |
          rm -f .github/workflows/audit-isolation8-doc-contract.yml
          rm -f .github/workflows/apply-isolation8-skill-doc-sync.yml

      - name: Commit verified documentation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: align embedded skill with async mutation tools"
          git push origin HEAD:agent/isolation8-skill-doc-sync
