# Temporary validation workflow; removed before merge.
name: Resource routing security validation

on:
  push:
    branches:
      - agent/resource-routing-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed routing hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Taxonomy URI segment compatibility with OpenViking and unique destinations.
          p = Path('resource-routing/taxonomy.ts')
          s = p.read_text()
          old = r'''const SEGMENT_RE = /^[^/\\?\0]+$/u;'''
          new = r'''const SEGMENT_RE = /^[\p{L}\p{N}\p{M}_.-]+$/u;'''
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('taxonomy segment regex hardening anchor missing')

          old_block = '''function validateSegment(segment: string, label: string): void {
  if (segment === "." || segment === ".." || !SEGMENT_RE.test(segment)) {
    throw new Error(`${label} is not a safe resource URI segment`);
  }
  if (segment.trim() !== segment) {
    throw new Error(`${label} must not have leading or trailing whitespace`);
  }
}'''
          new_block = '''function validateSegment(segment: string, label: string): void {
  if (segment === "." || segment === ".." || !SEGMENT_RE.test(segment)) {
    throw new Error(`${label} is not a safe resource URI segment`);
  }
  if (Array.from(segment).length > 50) {
    throw new Error(`${label} must be at most 50 characters`);
  }
}'''
          if old_block in s:
              s = s.replace(old_block, new_block, 1)
          if new_block not in s:
              raise SystemExit('taxonomy segment length hardening anchor missing')

          old = '''  const categories: ResourceTaxonomyCategory[] = [];
  const byKey = new Map<string, ResourceTaxonomyCategory>();'''
          new = '''  const categories: ResourceTaxonomyCategory[] = [];
  const byKey = new Map<string, ResourceTaxonomyCategory>();
  const byUri = new Set<string>();'''
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('taxonomy URI uniqueness state anchor missing')

          old = '''    const routeable = parseRouteable(node.routeable, `resource taxonomy category ${key}.routeable`);
    const uri = `${parentUri}/${segment}`;

    const category: ResourceTaxonomyCategory = {'''
          new = '''    const routeable = parseRouteable(node.routeable, `resource taxonomy category ${key}.routeable`);
    const uri = `${parentUri}/${segment}`;
    if (byUri.has(uri)) {
      throw new Error(`resource taxonomy contains duplicate destination URI: ${uri}`);
    }
    byUri.add(uri);

    const category: ResourceTaxonomyCategory = {'''
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('taxonomy duplicate destination anchor missing')
          p.write_text(s)

          # Strict endpoint URL composition and truly distinct per-agent paths.
          p = Path('resource-routing/config.ts')
          s = p.read_text()
          old_block = '''  if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
    throw new Error(`resourceRouting endpoint baseUrl must use http or https: ${value}`);
  }
  return value.replace(/\\/+$/, "");
}

function normalizeEndpointPath(value: string, label: string): string {
  if (!value.startsWith("/") || value.startsWith("//") || value.includes("?") || value.includes("#")) {
    throw new Error(`${label} must be an absolute URL path without query or fragment`);
  }
  return value;
}'''
          new_block = '''  if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
    throw new Error(`resourceRouting endpoint baseUrl must use http or https: ${value}`);
  }
  if (parsed.username || parsed.password) {
    throw new Error("resourceRouting endpoint baseUrl must not contain credentials; use apiKey or headers");
  }
  if (parsed.search || parsed.hash) {
    throw new Error("resourceRouting endpoint baseUrl must not contain query or fragment");
  }
  return value.replace(/\\/+$/, "");
}

function normalizeEndpointPath(value: string, label: string): string {
  const segments = value.split("/");
  if (
    !value.startsWith("/") ||
    value.startsWith("//") ||
    value.includes("?") ||
    value.includes("#") ||
    value.includes("\\\\") ||
    segments.some((segment) => segment === "." || segment === "..")
  ) {
    throw new Error(`${label} must be a safe absolute URL path without traversal, query, or fragment`);
  }
  return value;
}'''
          if old_block in s:
              s = s.replace(old_block, new_block, 1)
          if new_block not in s:
              raise SystemExit('endpoint URL hardening anchor missing')

          old_block = '''function validatePathTemplate(value: string, label: string): string {
  if (!value.includes("{agentId}")) {
    throw new Error(`${label} must contain {agentId} so every isolated agent gets its own file`);
  }
  return value;
}'''
          new_block = '''function validatePathTemplate(value: string, label: string): string {
  if (!value.includes("{agentId}")) {
    throw new Error(`${label} must contain {agentId} so every isolated agent gets its own file`);
  }
  const first = resolveAgentScopedResourceRoutingPath(value, "routing-isolation-a");
  const second = resolveAgentScopedResourceRoutingPath(value, "routing-isolation-b");
  if (first === second) {
    throw new Error(`${label} must resolve to distinct paths for different agents`);
  }
  return value;
}'''
          if old_block in s:
              s = s.replace(old_block, new_block, 1)
          if new_block not in s:
              raise SystemExit('per-agent path isolation anchor missing')
          p.write_text(s)

          # A configured fallback is part of taxonomy integrity, even for explicit category routing.
          p = Path('resource-routing/manager.ts')
          s = p.read_text()
          old = '''import {
  loadResourceTaxonomyFile,
  resolveResourceCategoryUri,
  type ResourceTaxonomy,
} from "./taxonomy.js";'''
          new = '''import {
  assertResourceRoutingFallbackCategory,
  loadResourceTaxonomyFile,
  resolveResourceCategoryUri,
  type ResourceTaxonomy,
} from "./taxonomy.js";'''
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('manager fallback import anchor missing')

          old = '''    const path = resolveAgentResourceRoutingPaths(this.config, agentId).taxonomyFile;
    const pending = this.loadTaxonomy(path);
    this.taxonomyPromises.set(agentId, pending);'''
          new = '''    const path = resolveAgentResourceRoutingPaths(this.config, agentId).taxonomyFile;
    const pending = this.loadTaxonomy(path).then((taxonomy) => {
      assertResourceRoutingFallbackCategory(taxonomy, this.config.fallbackCategory);
      return taxonomy;
    });
    this.taxonomyPromises.set(agentId, pending);'''
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('manager fallback validation anchor missing')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and tests
        run: npm run verify

      - name: Diff check
        run: git diff --check

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/openviking-pack.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/openviking-pack.json', 'utf8'));
          const files = new Set(data[0].files.map((entry) => entry.path));
          for (const required of [
            'resource-routing/default-taxonomy.yaml',
            'dist/resource-routing/manager.js',
            'dist/resource-routing/taxonomy.js',
            'dist/resource-routing/config.js',
          ]) {
            if (!files.has(required)) throw new Error(`package is missing ${required}`);
          }
          NODE

      - name: Commit verified hardening
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'resource-routing-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add resource-routing/taxonomy.ts resource-routing/config.ts resource-routing/manager.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Harden resource routing taxonomy integrity [skip ci]'
          git push origin HEAD:agent/resource-routing-v1
