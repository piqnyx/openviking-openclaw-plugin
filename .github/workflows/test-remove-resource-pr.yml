name: Test remove_resource PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-remove-resource:
    if: github.head_ref == 'feature/remove-resource'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/remove-resource

      - name: Require audited pre-hardening head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd7832fa9373dbb829df71f9f6288af54aeee6566'

      - name: Apply staged audit hardening
        shell: bash
        run: |
          set -euo pipefail
          git apply --check changes/remove-resource-hardening.patch
          git apply changes/remove-resource-hardening.patch
          rm -f changes/remove-resource-hardening.patch
          rmdir changes 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run verify

      - name: Typecheck including tests
        run: npm run typecheck

      - name: Commit only after all verification passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'piqnyx CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce resource-only deletion at client boundary'
          git push origin HEAD:feature/remove-resource
