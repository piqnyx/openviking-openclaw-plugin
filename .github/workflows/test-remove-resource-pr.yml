name: Test remove_resource PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-remove-resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run verify

      - name: Typecheck including tests
        run: npm run typecheck
