name: issue30 self apply

on:
  push:
    branches:
      - agent/harden-resource-mutations

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/harden-resource-mutations

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply hardening
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/fix-issue30-patcher.mjs ]; then
            node tools/fix-issue30-patcher.mjs
          fi
          node --check tools/apply-issue30-hardening.mjs
          node tools/apply-issue30-hardening.mjs

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify
        run: npm run verify

      - name: Diff check
        run: git diff --check

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/issue30-self-apply.yml

      - name: Commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix: harden agent resource mutations'
          git push origin HEAD:agent/harden-resource-mutations
