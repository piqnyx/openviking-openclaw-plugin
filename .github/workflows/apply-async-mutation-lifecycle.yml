name: Apply async mutation lifecycle

on:
  push:
    branches:
      - agent/async-mutation-lifecycle
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-async-mutation-lifecycle
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/async-mutation-lifecycle
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Repair one-shot script quoting and test typing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/apply-async-mutation-lifecycle.mjs")
          s = p.read_text()
          replacements = [
              (
                  'text: `OpenViking resource is already absent: ${validation.uri}.`,',
                  'text: "OpenViking resource is already absent: " + validation.uri + ".",',
              ),
              (
                  '`OpenViking removal outcome is unknown for ${validation.uri} because the transport failed without an HTTP response. Do not repeat the delete automatically. Inspect the URI first; retry only if it is still present.`,',
                  '"OpenViking removal outcome is unknown for " + validation.uri + " because the transport failed without an HTTP response. Do not repeat the delete automatically. Inspect the URI first; retry only if it is still present.",',
              ),
              (
                  '    expect(addResource.mock.calls[0]?.[0]).not.toHaveProperty("timeout");\n',
                  '',
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f"unexpected bootstrap target count for: {old[:60]}")
              s = s.replace(old, new)
          p.write_text(s)
          PY
          node --check scripts/apply-async-mutation-lifecycle.mjs

      - name: Apply audited lifecycle patch
        run: node scripts/apply-async-mutation-lifecycle.mjs

      - name: Align mutation integration regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("plugin/openviking-import-tools.ts")
          s = p.read_text()
          old = 'return error instanceof Error && /OpenViking request faileds*[NOT_FOUND]/i.test(error.message);'
          new = 'return error instanceof Error && error.message.includes("OpenViking request failed [NOT_FOUND]");'
          if s.count(old) != 1:
              raise SystemExit("unexpected generated NOT_FOUND matcher")
          p.write_text(s.replace(old, new))

          p = Path("tests/remove-resource-routing.test.ts")
          s = p.read_text()
          replacements = [
              (
                  'it("uses the current agent account and waits for consistency by default", async () => {',
                  'it("uses the current agent account and returns after deletion without waiting for semantic refresh", async () => {',
              ),
              (
                  'expect(calls).toEqual([{ key: "ov-main-key", wait: "true", uri: "viking://resources/workspace" }]);',
                  'expect(calls).toEqual([{ key: "ov-main-key", wait: "false", uri: "viking://resources/workspace" }]);',
              ),
              (
                  'expect(result.details).toMatchObject({ action: "resource_removed", semantic_status: "complete" });',
                  'expect(result.details).toMatchObject({ action: "resource_removed", processing: "semantic_refresh_queued", semantic_status: "queued" });',
              ),
              (
                  'expect(result.content?.[0]?.text).toContain("semantic refresh complete");',
                  'expect(result.content?.[0]?.text).toContain("continues asynchronously");',
              ),
              (
                  'it("keeps agent accounts isolated and reports queued cleanup when async is explicit", async () => {',
                  'it("keeps agent accounts isolated while semantic cleanup remains asynchronous", async () => {',
              ),
              (
                  'expect(result.content?.[0]?.text).toContain("still pending");',
                  'expect(result.content?.[0]?.text).toContain("continues asynchronously");',
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f"unexpected routing regression target: {old[:70]}")
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm run verify

      - name: Validate generated runtime and whitespace
        run: |
          git diff --check
          git status --short

      - name: Remove one-shot scaffolding
        run: |
          rm -f scripts/apply-async-mutation-lifecycle.mjs
          rm -f .github/workflows/apply-async-mutation-lifecycle.yml

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make agent mutations asynchronous"
          git push origin HEAD:agent/async-mutation-lifecycle
