name: Apply async mutation lifecycle

on:
  push:
    branches:
      - agent/async-mutation-lifecycle
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-async-mutation-lifecycle
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/async-mutation-lifecycle
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Repair one-shot script quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/apply-async-mutation-lifecycle.mjs")
          s = p.read_text()
          old1 = 'text: `OpenViking resource is already absent: ${validation.uri}.`,'
          new1 = 'text: "OpenViking resource is already absent: " + validation.uri + ".",'
          old2 = '`OpenViking removal outcome is unknown for ${validation.uri} because the transport failed without an HTTP response. Do not repeat the delete automatically. Inspect the URI first; retry only if it is still present.`,'
          new2 = '"OpenViking removal outcome is unknown for " + validation.uri + " because the transport failed without an HTTP response. Do not repeat the delete automatically. Inspect the URI first; retry only if it is still present.",'
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit("unexpected bootstrap quoting shape")
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          node --check scripts/apply-async-mutation-lifecycle.mjs

      - name: Apply audited lifecycle patch
        run: node scripts/apply-async-mutation-lifecycle.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm run verify

      - name: Validate generated runtime and whitespace
        run: |
          git diff --check
          git status --short

      - name: Remove one-shot scaffolding
        run: |
          rm -f scripts/apply-async-mutation-lifecycle.mjs
          rm -f .github/workflows/apply-async-mutation-lifecycle.yml

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make agent mutations asynchronous"
          git push origin HEAD:agent/async-mutation-lifecycle
